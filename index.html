<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - AI 金融情報網</title>
    <style>
        :root {
            --bg-main: #0B0E14; --bg-panel: #151A22;
            --text-main: #E0E6ED; --text-dim: #8B949E;
            --accent-glow: #00F0FF; --accent-alert: #FF3366;
            --border-line: #2D3748; --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        /* === 暗黑科技感卷軸 === */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B0E14; }
        ::-webkit-scrollbar-thumb { background: #2D3748; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00F0FF; }

        body { margin: 0; background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        header { padding: 20px 40px; border-bottom: 1px solid var(--border-line); display: flex; justify-content: space-between; align-items: center; background: rgba(11, 14, 20, 0.9); }
        main { display: flex; flex: 1; padding: 20px 40px; gap: 30px; overflow: hidden; }
        .side-panel { width: 320px; display: flex; flex-direction: column; gap: 20px; }
        .panel-box { background: var(--bg-panel); border: 1px solid var(--border-line); border-radius: 8px; padding: 20px; }
        
        /* === 終端機立體弧度與質感 === */
        .terminal-window {
            background: #0D1117; border: 12px solid #2D333B; border-radius: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.5);   
            position: relative; overflow: hidden; flex: 1; padding: 25px; overflow-y: auto;
        }
        /* 玻璃反光與掃描線：強制置頂 */
        .terminal-window::before, .terminal-window::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; z-index: 100;
        }
        .terminal-window::before { background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 50%); }
        .terminal-window::after { background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%); background-size: 100% 4px; }

        /* AI 報告文字區 */
        .ai-content {
            color: #FFFFFF; font-family: var(--font-mono); font-size: 1rem;
            white-space: pre-line; padding: 20px; background: rgba(0,0,0,0.3);
            border-left: 4px solid var(--accent-glow);
        }
        .code-h3 { color: #00F0FF; font-weight: bold; }
        .code-bullet { color: #FFB6C1; }
        .code-number { color: #D2B48C; }

        #standby-screen, #scanning-screen, #result-screen, #chat-interface { position: relative; z-index: 50; height: 100%; }
        #chat-interface { display: none; flex-direction: column; }
        #chat-history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-ai-msg { color: #33FF00; font-family: 'Courier New', monospace; }
        .chat-user-msg { color: #fff; opacity: 0.8; margin-left: 20px; font-family: 'Courier New', monospace; }
    </style>
</head>
<body>
    <header>
        <div class="logo"><div class="logo-dot"></div>NEXUS_INTELLIGENCE</div>
    </header>

    <main>
        <aside class="side-panel">
            <div class="panel-box">
                <button class="crt-power-btn" onclick="toggleCRT()">[ SYS_POWER : TOGGLE ]</button>
                <button class="crt-power-btn chat-btn" onclick="toggleChat()">[ INITIATE_COMMS ]</button>
                <div class="search-wrapper" style="margin-top:20px;">
                    <input type="text" id="target-input" class="search-input" placeholder="Symbol (e.g. 2330.TW)">
                    <button class="search-btn" onclick="initiateScan()">EXECUTE SCAN</button>
                </div>
            </div>
        </aside>

        <section class="main-display">
            <div class="terminal-window">
                <div id="crt-screen"></div>
                <div id="chat-interface">
                    <div id="chat-history"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Input Command..." onkeypress="if(event.key === 'Enter') sendChatMsg()">
                    </div>
                </div>
                <div id="result-screen">
                    <div class="ai-analysis-box">
                        <div class="ai-content" id="res-ai-text"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const BACKEND_URL = "https://ai-angine-analysis-the-stock.onrender.com";

        // 最穩定的打字機：逐字顯示純文字
        async function typeText(element, text, speed) {
            element.innerHTML = '';
            for (let char of text) {
                element.innerHTML += char;
                await new Promise(r => setTimeout(r, speed));
            }
        }

        async function sendChatMsg() {
            const input = document.getElementById('chat-input');
            const history = document.getElementById('chat-history');
            const text = input.value.trim();
            if(!text) return;
            
            history.innerHTML += `<div class="chat-user-msg">USER_> ${text}</div>`;
            input.value = '';

            const thinkId = 'think-' + Date.now();
            history.innerHTML += `<div class="chat-ai-msg" id="${thinkId}">> NEXUS: PROCESSING_</div>`;
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                const container = document.getElementById(thinkId);
                await typeText(container, `> NEXUS: ${data.reply}`, 30);
            } catch (e) {
                document.getElementById(thinkId).innerText = "> [ERR] DISCONNECTED";
            }
            history.scrollTop = history.scrollHeight;
        }

        function showResults(data) {
            document.getElementById('result-screen').style.display = 'block';
            const aiDisplay = document.getElementById('res-ai-text');
            // 為了不讓 HTML 標籤外露，先進行正規化替換
            let formatted = data.ai_analysis
                .replace(/### (.*)/g, '<span class="code-h3">$1</span>')
                .replace(/\* (.*?):/g, '<span class="code-bullet">* $1:</span>')
                .replace(/([\d\.]+%)/g, '<span class="code-number">$1</span>');
            
            aiDisplay.innerHTML = formatted;
        }
    </script>
</body>
</html>
